[project]
name = "crossword-agent"
version = "0.1.1"
description = "An LLM + constraint-satisfaction agent that solves crossword puzzles, with an evaluation harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mitchell Chaiet" }]
dependencies = [
    "openai>=1.40",
    "puzpy>=0.2.5",
    "rich>=13.7",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "numpy>=1.26",
    "pypdfium2>=4.30,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
crossword = "crossword_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crossword_agent", "webapp", "training"]

[tool.hatch.build.targets.sdist]
exclude = ["video/out/**", "video/node_modules/**", "dist/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
